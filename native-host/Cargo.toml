[package]
name = "nbs-native-host"
description = "Native Messaging host that relays browser extension messages to NBS Download Manager"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "time", "net", "process"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json = "1"
dirs = "6"
