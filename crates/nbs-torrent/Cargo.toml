[package]
name = "nbs-torrent"
description = "BitTorrent download and streaming engine for NBS Download Manager"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nbs-core = { path = "../nbs-core" }
anyhow = "1"
bytes = "1"
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls", "http-api", "tracing-subscriber-utils", "disable-upload"] }
librqbit-dualstack-sockets = "0.7"
parking_lot = "0.12"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
